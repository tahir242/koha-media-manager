# Test every push and pull request, build the plugin package, and publish a GitHub Release with the
# .kpz and its change log for every version tag (v1.2.3, or v1.2.3-beta / -rc.1 as a pre-release).
name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Perl dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libio-socket-ssl-perl libjson-perl liburi-perl

      - name: Run the test suite
        run: prove t/*.t

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the .kpz
        id: build
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then name="koha-media-manager-${GITHUB_REF_NAME}.kpz"; else name="koha-media-manager-${GITHUB_SHA::7}.kpz"; fi
          ./scripts/build_kpz.sh "$name" | tee build.log
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: kpz
          path: ${{ steps.build.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: kpz

      - name: Check the tag matches the plugin version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          plugin=$(sed -n "s/^our \$VERSION = '\([^']*\)';.*/\1/p" Koha/Plugin/Com/Library/MediaManager.pm)
          if [ "$base" != "$plugin" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the plugin \$VERSION ${plugin}."
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$base" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Write the release notes
        run: |
          # The CHANGELOG.md section of this version; otherwise the commits since the previous tag.
          awk -v v="${{ steps.version.outputs.base }}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            echo "## Changes" > notes.md
            git log --no-merges --pretty='- %s' ${previous:+"$previous.."}"${GITHUB_REF_NAME}" >> notes.md
          fi
          kpz="koha-media-manager-${GITHUB_REF_NAME}.kpz"
          {
            echo
            echo "## Install"
            echo
            echo "Download \`$kpz\` below and upload it in Koha: *Administration → Plugins → Upload plugin*."
            echo "Then restart Plack and clear the template cache. See the [User Manual](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/USER_MANUAL.md)."
            echo
            echo "SHA-256: \`$(sha256sum "$kpz" | cut -d' ' -f1)\`"
          } >> notes.md
          cat notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kpz="koha-media-manager-${GITHUB_REF_NAME}.kpz"
          flags=""
          if [ "${{ steps.version.outputs.prerelease }}" = true ]; then flags="--prerelease"; else flags="--latest"; fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$kpz" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" "$kpz" --title "Media Asset Management (MAM) for Koha ${GITHUB_REF_NAME}" --notes-file notes.md $flags
          fi
